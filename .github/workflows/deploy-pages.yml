name: Deploy no GitHub Pages

# O build legado do Pages sincronizava os 1790 arquivos versionados do repositorio
# e passou a estourar o limite de tempo (10min22s e 10min54s passaram raspando;
# 11min17s e 10min40s falharam). Aqui o artefato leva so o site.

on:
  push:
    branches: [master]
    paths:
      - 'assets/**'
      - 'index.html'
      - 'servicos.html'
      - 'style.css'
      - 'script.js'
      - 'servicos.js'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.nojekyll'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Sem cancel-in-progress: cancelar um deploy no meio deixaria o site publicado
# em estado parcial.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5 e a primeira major em node24. A v4 ainda era node20 e ja rodava
      # forcada em node24 pelo runner, com aviso — mesma divida da deploy-pages.
      # Exige runner >= v2.327.1; o ubuntu-latest hospedado passa folgado.
      - uses: actions/checkout@v5

      - name: Monta o artefato apenas com o site
        # Lista de inclusao, nao de exclusao: os .py e .json do pipeline de videos,
        # o .aiox-core e o docs/ nao sao conteudo do site e ficam fora. Se algum
        # arquivo da lista desaparecer, o cp falha e o deploy para aqui.
        run: |
          mkdir -p _site
          cp -r assets _site/
          cp index.html servicos.html style.css script.js servicos.js sitemap.xml robots.txt .nojekyll _site/
          echo "Arquivos no artefato: $(find _site -type f | wc -l)"
          echo "Peso do artefato: $(du -sh _site | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v5 e a primeira major em node24; a v4 era node20 e o runner ja a rodava
      # forcada em node24, avisando a cada deploy. O unico item funcional do
      # changelog da v5 e a troca do runtime, e os inputs sao os mesmos.
      #
      # O input `timeout` saiu daqui. Ele dizia 1800000 com um comentario
      # afirmando que "30min dao folga", mas a action corta qualquer valor pelo
      # seu proprio MAX_TIMEOUT de 600000ms (deployment.js: Math.min(input,
      # MAX_TIMEOUT)) e avisa no log. Os 30min nunca existiram: o teto sempre
      # foi 10min, e e nele que este deploy vive — o comentario no topo do
      # arquivo lista os runs de 10min22s e 10min54s que passaram raspando e os
      # de 11min17s e 10min40s que falharam. O artefato enxuto montado no job de
      # build existe justamente para caber nesse teto. Deixar o numero antigo
      # faria o proximo a ler o arquivo acreditar numa folga que nao ha.
      - id: deployment
        uses: actions/deploy-pages@v5
